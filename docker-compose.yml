services:
  jenkins:
    build: ./jenkins
    container_name: taverna-jenkins-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
    ports:
      - "8082:8080"
    volumes:
      - frontend_jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro

volumes:
  frontend_jenkins_home: